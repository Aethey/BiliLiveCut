name: Docker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          enable-cache: false
      - name: Build CPU image
        run: docker build --tag bili-live-cut:docker-test --file packaging/docker/Dockerfile .
      - name: Audit installed Python dependencies
        run: uv run --no-project --python 3.12 --with pip-audit==2.10.1 python scripts/audit_docker_runtime.py
      - name: Install browser for authentication acceptance
        run: uv run --no-project --python 3.12 --with playwright==1.61.0 playwright install --with-deps chromium
      - name: Smoke test container lifecycle and browser authentication
        run: uv run --no-project --python 3.12 --with playwright==1.61.0 python scripts/smoke_docker.py --browser
